[package]
name = "heimdall-cli"
description = "The Heimdall command line interface and (from Phase 2) MCP server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
repository.workspace = true

[[bin]]
name = "heimdall"
path = "src/main.rs"

[dependencies]
heimdall-core.workspace = true

camino.workspace = true
clap.workspace = true
rmcp = { workspace = true, features = ["server", "macros", "schemars", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

# Touch ID or the login password before an unlock (`presence.rs`).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
libc = "0.2"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSError"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rmcp = { workspace = true, features = ["client", "transport-child-process"] }
tempfile.workspace = true

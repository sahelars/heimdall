[package]
name = "heimdall-desktop"
description = "Edit a Heimdall vault and configure its local MCP server."
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false

[lib]
name = "heimdall_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Deliberately no `heimdall-core` dependency: the desktop reaches the domain
# only through its bundled CLI's published contract (SPEC §4).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11", features = [] }
# The folder picker only. There is deliberately no shell plugin: process
# execution stays in Rust and React is granted no way to run anything.
tauri-plugin-dialog = "2.7"
# ChatGPT's MCP configuration is a hand-kept TOML file; `toml_edit` writes one
# entry into it and leaves every comment and table around it as it was.
toml_edit = "0.25"

[dev-dependencies]
tempfile = "3"

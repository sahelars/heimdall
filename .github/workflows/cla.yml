# Every outside contributor signs the Contributor License Agreement (CLA.md)
# once, by commenting on their first pull request. Signatures are recorded in
# signatures/cla.json on the `cla-signatures` branch, never on master.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # v2.6.1. Pinned to a commit because this job runs with write access.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/sahelars/heimdall/blob/master/CLA.md
          branch: cla-signatures
          allowlist: sahelars,bot*
